<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2b45">
<meta name="robots" content="noindex">
<title>Pointage — MADY PROCLEAN</title>
<script src="config.js"></script>
<style>
  :root{
    --navy:#0d2b45; --navy2:#16466e; --bg:#eef3f7; --card:#fff; --ink:#0d2b45; --muted:#5d7083;
    --green:#15803d; --green-bg:#dcfce7; --orange:#c2410c; --orange-bg:#ffedd5; --red:#b91c1c; --red-bg:#fee2e2;
    --line:#d8e2ea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 18px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:800;letter-spacing:.06em;font-size:17px}
  .brand span{color:#7cc4f5}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
  main{max-width:460px;margin:-6px auto 0;padding:0 14px 40px}
  .card{background:var(--card);border-radius:18px;padding:24px 20px;margin-top:16px;box-shadow:0 2px 10px rgba(13,43,69,.08)}
  .center{text-align:center}
  .hidden{display:none!important}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px;font-weight:600}
  h1{font-size:24px;line-height:1.2;margin:0 0 4px}
  h2{font-size:20px;margin:8px 0}
  .muted{color:var(--muted);margin:0}
  label.f{display:block;font-weight:600;margin:22px 0 8px}
  input#code{width:100%;font-size:30px;letter-spacing:.35em;text-align:center;padding:14px;border:2px solid var(--line);border-radius:14px;font-variant-numeric:tabular-nums;color:var(--ink);background:#f8fbfd}
  input#code:focus{outline:none;border-color:var(--navy2);background:#fff}
  .remember{display:flex;align-items:center;gap:10px;margin:14px 0 4px;color:var(--muted);font-size:15px}
  .remember input{width:20px;height:20px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:18px;font-weight:700;margin-top:18px;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.6}
  .primary{background:var(--navy);color:#fff}
  .ghost{background:#e6edf3;color:var(--ink)}
  .huge{padding:30px 16px;font-size:23px;letter-spacing:.02em;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
  .huge small{display:block;font-size:14px;font-weight:500;opacity:.9;margin-top:6px;letter-spacing:0}
  .arr{background:var(--green);color:#fff}
  .dep{background:var(--orange);color:#fff}
  .gps{margin-top:16px;font-size:14px;padding:10px 12px;border-radius:10px;background:#f1f5f9;color:var(--muted)}
  .gps.ok{background:var(--green-bg);color:var(--green)}
  .gps.bad{background:var(--red-bg);color:var(--red)}
  .prevu{margin:16px 0 4px;padding:12px 14px;border-radius:12px;background:#f1f6fa;font-size:15px}
  .prevu b{font-variant-numeric:tabular-nums}
  .warn{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--orange-bg);color:var(--orange);font-size:14px}
  .err{color:var(--red);background:var(--red-bg);border-radius:10px;padding:10px 12px;margin:14px 0 0;font-size:15px}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;margin:20px auto 0;display:block;cursor:pointer;font-family:inherit}
  .check{width:92px;height:92px;border-radius:50%;margin:4px auto 14px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;background:var(--green)}
  .check.dep{background:var(--orange)}
  .bigtime{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 10px}
  .badge{display:inline-block;padding:7px 14px;border-radius:999px;font-weight:700;font-size:15px}
  .b-ok{background:var(--green-bg);color:var(--green)}
  .b-warn{background:var(--orange-bg);color:var(--orange)}
  .b-bad{background:var(--red-bg);color:var(--red)}
  .spin{width:38px;height:38px;border:4px solid #d6e2ec;border-top-color:var(--navy);border-radius:50%;margin:10px auto 14px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .big-ico{font-size:44px}
  footer{text-align:center;color:#8aa0b3;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<header>
  <div class="brand">MADY <span>PROCLEAN</span></div>
  <div class="clock" id="clock">--:--</div>
</header>

<main>
  <section id="v-load" class="card center">
    <div class="spin"></div><p class="muted">Chargement…</p>
  </section>

  <section id="v-err" class="card center hidden">
    <div class="big-ico">⚠️</div>
    <h2 id="err-t">Erreur</h2>
    <p class="muted" id="err-m"></p>
    <button class="btn ghost" onclick="location.reload()">Réessayer</button>
  </section>

  <section id="v-code" class="card hidden">
    <p class="lbl">Pointage sur le site</p>
    <h1 class="site-nom"></h1>
    <p class="muted site-client"></p>
    <label class="f" for="code">Votre code personnel</label>
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8" placeholder="••••">
    <label class="remember"><input type="checkbox" id="remember" checked> Se souvenir de moi sur ce téléphone</label>
    <p class="err hidden" id="code-err"></p>
    <button id="b-id" class="btn primary">Continuer</button>
    <div class="gps" id="gps1"></div>
  </section>

  <section id="v-act" class="card hidden">
    <p class="lbl">Bonjour</p>
    <h1 id="agent-nom"></h1>
    <p class="muted">📍 <span class="site-nom"></span></p>
    <div id="prevu" class="prevu"></div>
    <div id="autre" class="warn hidden"></div>
    <p class="err hidden" id="act-err"></p>
    <button id="b-point" class="btn huge"></button>
    <div class="gps" id="gps2"></div>
    <button class="link" id="b-notme">Ce n'est pas moi</button>
  </section>

  <section id="v-ok" class="card center hidden">
    <div class="check" id="ok-ico">✓</div>
    <h2 id="ok-t"></h2>
    <div class="bigtime" id="ok-h"></div>
    <span class="badge" id="ok-s"></span>
    <p class="muted" id="ok-d" style="margin-top:14px"></p>
    <button class="btn ghost" id="b-back">Terminé</button>
  </section>

  <footer>Pointage MADY PROCLEAN · votre position est vérifiée uniquement au moment du pointage</footer>
</main>

<script>
(function(){
  'use strict';
  var API = window.POINTAGE_API || '';
  var qs = new URLSearchParams(location.search);
  var S = qs.get('s') || '', K = qs.get('k') || '';
  var $ = function(id){ return document.getElementById(id); };
  var LS = {
    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
  };
  var dev = LS.get('mp_dev');
  if (!dev) { dev = Math.random().toString(36).slice(2,10); LS.set('mp_dev', dev); }

  var fix = null, gpsErr = null, code = null, state = null;

  // Horloge
  function tick(){ var d = new Date(); $('clock').textContent = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  tick(); setInterval(tick, 5000);

  function show(v){ ['load','err','code','act','ok'].forEach(function(x){ $('v-'+x).classList.toggle('hidden', x !== v); }); }
  function fail(t, m){ $('err-t').textContent = t; $('err-m').textContent = m; show('err'); }
  function inlineErr(id, m){ var el = $(id); el.textContent = m || ''; el.classList.toggle('hidden', !m); }
  function setAll(cls, txt){ var els = document.querySelectorAll('.'+cls); for (var i=0;i<els.length;i++) els[i].textContent = txt; }

  function api(action, data){
    var body = Object.assign({ action: action, s: S, k: K }, data || {});
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })
      .catch(function(){ throw new Error('Pas de connexion internet. Vérifiez le réseau et réessayez.'); })
      .then(function(r){ return r.json().catch(function(){ throw new Error('Le serveur ne répond pas correctement. Réessayez dans un instant.'); }); })
      .then(function(j){ if (!j.ok) throw new Error(j.error || 'Erreur inconnue.'); return j; });
  }

  // ---------- GPS
  function startGps(){
    if (!('geolocation' in navigator)) { gpsErr = 'Ce téléphone ne permet pas la localisation.'; renderGps(); return; }
    navigator.geolocation.watchPosition(function(p){
      var f = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
      if (!fix || f.acc <= fix.acc || Date.now() - fix.t > 20000) fix = f;
      gpsErr = null; renderGps();
    }, function(e){
      if (fix && Date.now() - fix.t < 60000) return;
      gpsErr = e.code === 1
        ? 'Localisation refusée. Autorisez la position dans les réglages du navigateur, puis rechargez la page.'
        : 'Position introuvable. Activez le GPS ou rapprochez-vous d\'une fenêtre.';
      renderGps();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
  }
  function renderGps(){
    var txt, cls = 'gps';
    if (fix) { txt = '📍 Position trouvée (précision ' + Math.round(fix.acc) + ' m)'; cls += ' ok'; }
    else if (gpsErr) { txt = '⚠️ ' + gpsErr; cls += ' bad'; }
    else txt = '📡 Recherche de votre position…';
    ['gps1','gps2'].forEach(function(id){ $(id).textContent = txt; $(id).className = cls; });
  }
  function waitFix(ms){
    return new Promise(function(res){
      var fresh = function(){ return fix && Date.now() - fix.t < 60000; };
      if (fresh()) return res(fix);
      var t0 = Date.now();
      var iv = setInterval(function(){
        if (fresh() || Date.now() - t0 > ms) { clearInterval(iv); res(fresh() ? fix : null); }
      }, 300);
    });
  }

  // ---------- Étapes
  function init(){
    if (!API || API.indexOf('COLLER_ICI') !== -1) return fail('Configuration incomplète', 'L\'adresse du serveur n\'est pas encore renseignée dans config.js.');
    if (!S || !K) return fail('QR code incomplet', 'Scannez le QR code affiché sur votre lieu de travail.');
    startGps(); renderGps();
    api('site').then(function(r){
      setAll('site-nom', r.site.nom);
      setAll('site-client', r.site.client || '');
      document.title = 'Pointage — ' + r.site.nom;
      var saved = LS.get('mp_code');
      if (saved) { code = saved; identify(true); }
      else { show('code'); }
    }).catch(function(e){ fail('Site introuvable', e.message); });
  }

  function identify(auto){
    var b = $('b-id');
    b.disabled = true; b.textContent = 'Vérification…';
    inlineErr('code-err', '');
    if (auto) show('load');
    api('identifier', { code: code }).then(function(r){
      state = r;
      if ($('remember').checked || auto) LS.set('mp_code', code); else LS.del('mp_code');
      renderAct();
    }).catch(function(e){
      if (auto) { LS.del('mp_code'); code = null; }
      show('code');
      inlineErr('code-err', e.message);
    }).then(function(){ b.disabled = false; b.textContent = 'Continuer'; });
  }

  function renderAct(){
    $('agent-nom').textContent = (state.agent.prenom + ' ' + state.agent.nom).trim();
    var pv = $('prevu'); pv.textContent = '';
    if (state.plans && state.plans.length) {
      state.plans.forEach(function(p, i){
        var line = document.createElement('div');
        if (i) line.style.marginTop = '6px';
        line.appendChild(document.createTextNode(i ? '' : 'Prévu aujourd\'hui : '));
        var b = document.createElement('b'); b.textContent = p.debut + (p.fin ? ' – ' + p.fin : '');
        line.appendChild(b);
        line.appendChild(document.createTextNode(' (' + p.type.toLowerCase() + ')'));
        pv.appendChild(line);
      });
    } else pv.textContent = 'Aucune prestation prévue aujourd\'hui sur ce site.';
    if (state.sens === 'DÉPART' && state.depuis) {
      var d = document.createElement('div'); d.style.marginTop = '8px';
      d.textContent = '✅ Arrivée pointée à ' + state.depuis;
      pv.appendChild(d);
    }
    var autre = $('autre');
    if (state.autreSite) { autre.textContent = 'Votre départ de « ' + state.autreSite + ' » n\'a pas été pointé. Votre responsable sera prévenu.'; autre.classList.remove('hidden'); }
    else autre.classList.add('hidden');
    setBtn();
    inlineErr('act-err', '');
    show('act');
  }

  function setBtn(){
    var b = $('b-point'), dep = state.sens === 'DÉPART';
    b.className = 'btn huge ' + (dep ? 'dep' : 'arr');
    b.textContent = '';
    b.appendChild(document.createTextNode(dep ? 'Pointer mon DÉPART' : 'Pointer mon ARRIVÉE'));
    var s = document.createElement('small'); s.textContent = dep ? 'à la fin de la prestation' : 'je suis arrivé(e) sur le site';
    b.appendChild(s);
    b.disabled = false;
  }

  function pointer(){
    var b = $('b-point');
    b.disabled = true; b.textContent = 'Localisation en cours…';
    inlineErr('act-err', '');
    waitFix(12000).then(function(f){
      b.textContent = 'Enregistrement…';
      return api('pointer', { code: code, lat: f ? f.lat : null, lng: f ? f.lng : null, acc: f ? f.acc : null, dev: dev });
    }).then(function(r){
      var dep = r.sens === 'DÉPART';
      $('ok-ico').className = 'check' + (dep ? ' dep' : '');
      $('ok-t').textContent = dep ? 'Départ enregistré' : 'Arrivée enregistrée';
      $('ok-h').textContent = r.heure;
      var s = $('ok-s'), st = String(r.statut || '');
      s.textContent = st;
      s.className = 'badge ' + (/HORS|Retard|anticip/.test(st) ? (/HORS/.test(st) ? 'b-bad' : 'b-warn') : 'b-ok');
      var det = '';
      if (!dep && r.ecart != null && r.ecart !== '') {
        var e = +r.ecart;
        det = e > 0 ? 'Retard de ' + e + ' min par rapport à l\'heure prévue.' : (e < 0 ? 'En avance de ' + (-e) + ' min.' : 'Pile à l\'heure.');
      }
      if (dep && r.duree != null && r.duree !== '') {
        var m = Math.max(0, Math.round(+r.duree));
        det = 'Durée de la prestation : ' + Math.floor(m/60) + 'h' + ('0'+(m%60)).slice(-2) + '. Bonne fin de journée !';
      }
      if (r.doublon) det = 'Ce pointage était déjà enregistré. ' + det;
      $('ok-d').textContent = det || (dep ? 'Bonne fin de journée !' : 'Bon courage !');
      show('ok');
      if (navigator.vibrate) navigator.vibrate(120);
    }).catch(function(e){
      inlineErr('act-err', e.message);
      setBtn();
    });
  }

  // ---------- Événements
  $('b-id').addEventListener('click', function(){
    var c = $('code').value.replace(/\D/g, '');
    if (c.length < 3) return inlineErr('code-err', 'Tapez votre code personnel.');
    code = c; identify(false);
  });
  $('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('b-id').click(); });
  $('b-point').addEventListener('click', pointer);
  $('b-notme').addEventListener('click', function(){ LS.del('mp_code'); code = null; $('code').value = ''; inlineErr('code-err',''); show('code'); });
  $('b-back').addEventListener('click', function(){ if (code) identify(true); else show('code'); });

  init();
})();
</script>
</body>
</html>
